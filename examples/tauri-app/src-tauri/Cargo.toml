[package]
name = "tauri-app"
version = "0.1.0"
description = "Example app for tauri-plugin-ffp-ota-updater"
edition = "2021"
publish = false

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-ffp-ota-updater = { path = "../../../" }
